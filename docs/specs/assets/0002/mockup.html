<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 图集 · 重设计稿（规格 0002 附件）</title>
<style>
/* ================= 设计稿外壳（控制条与舞台，不属于设计本身） ================= */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #1a1a1c; color: #eee; font: 13px/1.4 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; }

#ctl { position: fixed; inset: 0 0 auto 0; z-index: 100; background: #0f0f11; border-bottom: 1px solid #28282d; padding: 9px 16px 8px; display: flex; flex-direction: column; gap: 7px; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.ctl-brand { font-weight: 600; color: #fff; margin-right: 4px; }
.ctl-g { display: flex; align-items: center; gap: 7px; }
.ctl-g > span { color: #85858c; font-size: 12px; }
.ctl-seg { display: inline-flex; background: #1c1c20; border: 1px solid #2c2c32; border-radius: 8px; padding: 2px; }
.ctl-seg button { border: 0; background: none; color: #b4b4ba; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
.ctl-seg button:hover { color: #fff; }
.ctl-seg button[aria-pressed="true"] { background: #f1f1f1; color: #111; }
.ctl-desc { display: flex; gap: 14px; align-items: center; color: #a6a6ad; font-size: 12px; flex-wrap: wrap; }
.ctl-desc b { color: #fff; font-weight: 600; }
.ctl-sw { display: flex; gap: 3px; }
.ctl-sw i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,.18); }
.ctl-tip { margin-left: auto; color: #6e6e75; }
#stage { position: fixed; top: var(--ctl-h, 84px); left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
#stage[data-vp="mobile"] { background: radial-gradient(900px 500px at 50% 0%, #2a2a30, #151517); }
#stage[data-vp="desktop"] #device { width: 100%; height: 100%; }
#stage[data-vp="mobile"] #device { width: 375px; height: min(812px, calc(100% - 44px)); border-radius: 38px; box-shadow: 0 0 0 10px #232327, 0 0 0 11px #3b3b42, 0 40px 90px rgba(0,0,0,.6); }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px); opacity: 0; background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 200; transition: .25s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ================= 设计令牌：四种风格 × 深浅两套 ================= */
#device[data-style="minimal"] { --font-ui: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --font-display: var(--font-ui); --font-num: "Avenir Next", sans-serif; --r-card: 6px; --r-ctl: 999px; --r-btn: 999px; --r-modal: 14px; }
#device[data-style="minimal"][data-theme="light"] { --bg: #fbfbf9; --surface: #ffffff; --surface-2: #f1f1ee; --fg: #141414; --muted: #74746e; --faint: #a4a49d; --border: #e8e7e2; --accent: #e0452b; --accent-fg: #fff; --mark: #ffe49a; --header-bg: rgba(251,251,249,.88); --overlay: rgba(248,248,246,.84); --media-bg: #f1f1ee; --shadow-pop: 0 30px 80px -24px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.05); }
#device[data-style="minimal"][data-theme="dark"] { --bg: #0e0e0d; --surface: #161615; --surface-2: #1f1f1d; --fg: #f2f2ef; --muted: #9b9b94; --faint: #64645e; --border: #2a2a27; --accent: #ff6b4f; --accent-fg: #1a0c08; --mark: #5b4712; --header-bg: rgba(14,14,13,.86); --overlay: rgba(8,8,8,.82); --media-bg: #121211; --shadow-pop: 0 30px 80px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06); }

#device[data-style="immersive"] { --font-ui: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --font-display: "Avenir Next Condensed", "Avenir Next", "PingFang SC", sans-serif; --font-num: "Avenir Next Condensed", "Avenir Next", sans-serif; --r-card: 10px; --r-ctl: 999px; --r-btn: 999px; --r-modal: 20px; }
#device[data-style="immersive"][data-theme="dark"] { --bg: #070708; --surface: #111113; --surface-2: #1b1b1f; --fg: #f4f3ef; --muted: #8f8e96; --faint: #5b5a62; --border: rgba(255,255,255,.09); --accent: #f3b64a; --accent-fg: #1b1204; --mark: rgba(243,182,74,.4); --header-bg: rgba(20,20,23,.62); --overlay: rgba(0,0,0,.74); --media-bg: #000; --shadow-pop: 0 40px 100px -20px rgba(0,0,0,.9); }
#device[data-style="immersive"][data-theme="light"] { --bg: #ecebe7; --surface: #fbfbfa; --surface-2: #e3e2dd; --fg: #121212; --muted: #69685f; --faint: #9c9b94; --border: rgba(0,0,0,.09); --accent: #b8740f; --accent-fg: #fff; --mark: rgba(243,182,74,.5); --header-bg: rgba(251,251,250,.66); --overlay: rgba(20,20,20,.55); --media-bg: #19191a; --shadow-pop: 0 40px 100px -20px rgba(0,0,0,.45); }

#device[data-style="editorial"] { --font-ui: "PingFang SC", "Avenir Next", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --font-display: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif; --font-num: "Didot", "Bodoni 72", "Bodoni MT", Georgia, serif; --r-card: 0px; --r-ctl: 2px; --r-btn: 2px; --r-modal: 2px; }
#device[data-style="editorial"][data-theme="light"] { --bg: #f3eee3; --surface: #faf7ef; --surface-2: #ebe4d5; --fg: #1d1a15; --muted: #776e61; --faint: #a89f90; --border: #d6ccba; --accent: #a3281b; --accent-fg: #fbf6ea; --mark: #f0d58c; --header-bg: rgba(243,238,227,.94); --overlay: rgba(45,36,22,.5); --media-bg: #e8e1d1; --shadow-pop: 0 30px 80px -30px rgba(40,30,15,.45); }
#device[data-style="editorial"][data-theme="dark"] { --bg: #15130f; --surface: #1c1a15; --surface-2: #26221b; --fg: #ede5d5; --muted: #a2988a; --faint: #6f675b; --border: #3a342a; --accent: #e36a52; --accent-fg: #1a0f0a; --mark: #6a5318; --header-bg: rgba(21,19,15,.94); --overlay: rgba(0,0,0,.62); --media-bg: #100e0b; --shadow-pop: 0 30px 80px -30px rgba(0,0,0,.9); }

#device[data-style="soft"] { --font-ui: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --font-display: var(--font-ui); --font-num: "Avenir Next", sans-serif; --r-card: 16px; --r-ctl: 12px; --r-btn: 12px; --r-modal: 24px; }
#device[data-style="soft"][data-theme="light"] { --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eef1f6; --fg: #161b26; --muted: #667085; --faint: #98a2b3; --border: #e4e8ef; --accent: #3563f0; --accent-fg: #fff; --mark: #fff0b3; --header-bg: rgba(255,255,255,.86); --overlay: rgba(15,20,35,.42); --media-bg: #eef1f6; --shadow-pop: 0 30px 80px -20px rgba(16,24,40,.3); --shadow-card: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px -4px rgba(16,24,40,.08); --shadow-hover: 0 2px 4px rgba(16,24,40,.06), 0 18px 36px -12px rgba(16,24,40,.24); }
#device[data-style="soft"][data-theme="dark"] { --bg: #0c0f15; --surface: #141922; --surface-2: #1b2130; --fg: #e8ecf4; --muted: #8e98aa; --faint: #5d6679; --border: #242b3a; --accent: #5b87ff; --accent-fg: #fff; --mark: #5a4a12; --header-bg: rgba(20,25,34,.86); --overlay: rgba(0,0,0,.6); --media-bg: #0f131b; --shadow-pop: 0 30px 80px -20px rgba(0,0,0,.8); --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px -4px rgba(0,0,0,.4); --shadow-hover: 0 2px 4px rgba(0,0,0,.3), 0 18px 36px -12px rgba(0,0,0,.7); }

/* ================= 通用结构 ================= */
#device { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
#scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--bg); }
#layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
#layer > * { pointer-events: auto; }
#device[data-vp="mobile"] #scroller, #device[data-vp="mobile"] #layer { top: 30px; }
#device :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hide { display: none !important; }

.wrap { max-width: 1480px; margin: 0 auto; padding: 0 32px; }
#device[data-vp="mobile"] .wrap { padding: 0 12px; }

/* 吸顶栏 */
.hdr { position: sticky; top: 0; z-index: 20; background: var(--header-bg); -webkit-backdrop-filter: saturate(1.5) blur(16px); backdrop-filter: saturate(1.5) blur(16px); }
.hdr-row { display: flex; align-items: center; gap: 20px; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
.logo b { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.search { flex: 1; max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 14px; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-ctl); color: var(--muted); transition: .2s; min-width: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--fg); }
.search input::placeholder { color: var(--faint); }
.search kbd { font: 11px var(--font-ui); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--faint); }
.clr { border: 0; background: none; display: grid; place-items: center; color: var(--muted); padding: 4px; }
.hdr-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); color: var(--fg); transition: .15s; flex-shrink: 0; padding: 0; }
.iconbtn:hover { border-color: var(--fg); }
.iconbtn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.iconbtn.sm { width: 32px; height: 32px; }
.ttg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); }
.ttg button { width: 30px; height: 30px; border: 0; background: none; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--muted); padding: 0; }
.ttg button[aria-checked="true"] { background: var(--fg); color: var(--bg); }

.cats-row { display: flex; align-items: center; gap: 12px; height: 52px; }
.filter-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; flex-shrink: 0; }
.filter-btn.on, .filter-btn:hover { border-color: var(--fg); }
.fb-n { min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.cats { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; height: 100%; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
.cats::-webkit-scrollbar { display: none; }
.cat { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; background: none; border-radius: var(--r-ctl); font-size: 14px; color: var(--muted); white-space: nowrap; position: relative; }
.cat .n { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.cat:hover, .cat[aria-pressed="true"] { color: var(--fg); }

/* 筛选面板 */
.fpanel { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; }
.fp-inner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-modal); box-shadow: var(--shadow-pop); padding: 24px; display: grid; gap: 20px; margin-top: 8px; animation: drop .22s cubic-bezier(.2,.8,.2,1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.fp-body { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.fg-h { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; letter-spacing: .06em; }
.fg-l { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: var(--r-ctl); border: 1px solid var(--border); background: transparent; font-size: 13px; }
.tag span { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tag:hover { border-color: var(--fg); }
.tag[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag[aria-pressed="true"] span { color: inherit; opacity: .6; }
.fp-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--border); padding-top: 18px; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 40px; height: 24px; border-radius: 12px; background: var(--border); position: relative; transition: .2s; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
.switch input:checked + .sw { background: var(--accent); }
.switch input:checked + .sw::after { transform: translateX(16px); }
.switch input:focus-visible + .sw { outline: 2px solid var(--fg); outline-offset: 2px; }
.switch b { display: block; font-size: 14px; }
.switch small { display: block; color: var(--muted); font-size: 12px; }
.fp-actions { display: flex; gap: 8px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px 0; animation: sheetup .3s cubic-bezier(.2,.8,.2,1) both; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 16px; font-size: 17px; font-family: var(--font-display); }
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 600; white-space: nowrap; transition: .15s; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--fg); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: #d93a2b; border-color: rgba(217,58,43,.35); background: none; }
.btn.danger:hover { background: rgba(217,58,43,.08); border-color: #d93a2b; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }

/* 结果栏 */
.main { padding: 20px 0 80px; }
.rbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 30px; margin-bottom: 18px; color: var(--muted); font-size: 13px; }
.rc b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.achip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 10px; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--fg); font-size: 12px; border: 0; }
.achip:hover { background: var(--border); }
.lnk { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 0; }
.lnk:hover { color: var(--fg); }
.rsrc { margin-left: auto; color: var(--faint); font-size: 12px; }
.rsrc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
.degrade { color: var(--faint); font-size: 12px; }

/* 瀑布流 */
.grid { position: relative; }
.card { position: absolute; display: flex; flex-direction: column; text-decoration: none; color: inherit; outline: none; animation: rise .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(min(var(--i), 18) * 32ms); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.card-media { position: relative; overflow: hidden; border-radius: var(--r-card); flex-shrink: 0; }
.card-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; opacity: 0; transition: opacity .5s, transform .7s cubic-bezier(.2,.7,.2,1); }
.card-media img.ok { opacity: 1; }
.card:hover .card-media img { transform: scale(1.035); }
.card:focus-visible .card-media { outline: 2px solid var(--fg); outline-offset: 3px; }
.qcopy { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: var(--r-btn); border: 0; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; transform: translateY(-4px); transition: .2s; z-index: 2; padding: 0; }
.card:hover .qcopy, .card:focus-visible .qcopy { opacity: 1; transform: none; }
.qcopy:hover { background: rgba(0,0,0,.8); }
.noimg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--faint); font-size: 12px; background: var(--surface-2); }
.ov { position: absolute; inset: auto 0 0 0; padding: 36px 14px 14px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.78)); opacity: 0; transform: translateY(6px); transition: .25s; pointer-events: none; }
.card:hover .ov { opacity: 1; transform: none; }
.ov p { margin: 0; font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.86); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cb { overflow: hidden; }
.cb-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-e { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.sk { background: linear-gradient(90deg, var(--surface-2) 25%, color-mix(in oklab, var(--surface-2) 45%, var(--border)) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.sk-card { animation: none; }
.sk-l { height: 10px; border-radius: 4px; margin-top: 9px; }
.endnote { text-align: center; color: var(--faint); padding: 36px 0 0; font-size: 13px; }
.empty { display: grid; place-items: center; gap: 6px; padding: 90px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--r-modal); }
.empty h3 { margin: 6px 0 0; color: var(--fg); font-family: var(--font-display); }
.empty p { margin: 0; font-size: 13px; }

/* 详情弹窗 */
.backdrop { position: absolute; inset: 0; background: var(--overlay); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.modal { position: absolute; top: 28px; bottom: 28px; left: 50%; transform: translateX(-50%); width: min(1220px, calc(100% - 56px)); background: var(--surface); border-radius: var(--r-modal); display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(380px, .88fr); overflow: hidden; box-shadow: var(--shadow-pop); animation: pop .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.985); } }
.m-close { position: absolute; top: 16px; right: 16px; z-index: 5; }
.m-media { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; background: var(--media-bg); min-height: 0; overflow: hidden; }
.m-img { position: relative; z-index: 1; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.m-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; border-radius: calc(var(--r-card) * .7); box-shadow: 0 24px 60px -24px rgba(0,0,0,.55); }
.m-noimg { position: relative; z-index: 1; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.m-thumbs { position: relative; z-index: 1; display: flex; gap: 8px; }
.m-thumbs button { width: 52px; height: 52px; padding: 0; border: 2px solid transparent; border-radius: calc(var(--r-card) * .6 + 2px); overflow: hidden; opacity: .55; background: none; transition: .15s; }
.m-thumbs button:hover { opacity: .9; }
.m-thumbs button[aria-pressed="true"] { border-color: var(--accent); opacity: 1; }
.m-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

<script>
/* ---------- 数据准备 ---------- */
const D = window.MOCK;
const TAGS = {
  ratio: ['9:16', '2:3', '3:4', '1:1', '4:3', '3:2', '16:9'],
  style: ['写实', '国潮', '插画', '极简', '复古胶片', '赛博朋克', '3D 渲染', '水彩'],
  model: ['GPT-Image', '即梦', 'Midjourney', 'Nano Banana', 'Flux'],
  other: ['小红书', '电商', '教程'],

const TOTAL = D.categories.reduce((s, c) => s + c.total, 0);
const WITH_IMG = D.categories.reduce((s, c) => s + c.with_image, 0);

function ratioOf(w, h) {
  let best = '1:1', bd = 9;
  for (const t of TAGS.ratio) { const [a, b] = t.split(':').map(Number); const d = Math.abs(b / a - h / w); if (d < bd) { bd = d; best = t; } }
  return best;
}

  const tags = [
    { kind: 'ratio', name: ratioOf(it.w, it.h) },
    { kind: 'style', name: TAGS.style[(i * 5) % TAGS.style.length] },
    { kind: 'model', name: TAGS.model[(i * 3) % TAGS.model.length] },
  ];
  if (i % 4 === 0) tags.push({ kind: 'other', name: TAGS.other[i % 3] });
  return { ...it, ratio: tags[0].name, tags, up: 3 + ((i * 37) % 320) };
});
BASE.forEach((it, i) => {
  it.images = (i % 3 === 0 ? [it, BASE[(i + 5) % BASE.length], BASE[(i + 11) % BASE.length]] : [it]).map((x) => ({ img: x.img, color: x.color }));

  { id: 9001, title: '赛博朋克雨夜街景', category: '场景与叙事', source: '未提供', excerpt: '霓虹灯下的雨夜小巷，湿润路面反射粉蓝色光斑，远处是层叠的全息广告牌与悬浮列车……', prompt: '霓虹灯下的雨夜小巷，湿润路面反射粉蓝色光斑，远处是层叠的全息广告牌与悬浮列车，电影感构图，35mm 镜头，浅景深。', img: null, color: null, tags: [{ kind: 'style', name: '赛博朋克' }], ratio: '—', images: [] },
  { id: 9002, title: '极简产品主图模板', category: '商品与电商', source: '小红书', excerpt: '纯色背景上的单件商品，柔和顶光，底部留白用于放置卖点文字……', prompt: '纯色背景上的单件商品，柔和顶光，底部留白用于放置卖点文字，电商主图，1:1。', img: null, color: null, tags: [{ kind: 'other', name: '电商' }], ratio: '—', images: [] },
];
const ALL = new Map([...ITEMS, ...NOIMG].map((i) => [i.id, i]));
const SKEL = [1.33, 1, 1.5, 0.75, 1.25].map((r, i) => ({ sk: true, id: -1 - i, w: 100, h: 100 * r }));

const STYLES = {
  minimal: { name: '极简画廊', code: '白墙', theme: 'light', desc: '像美术馆的白墙，只让图片说话：没有描边和阴影，文字退到图片下方并弱化；唯一的强调色朱红只用在选中态和计数上。', fonts: 'Avenir Next + 苹方', sw: ['#fbfbf9', '#141414', '#74746e', '#e8e7e2', '#e0452b'] },
  immersive: { name: '暗色沉浸', code: '暗房', theme: 'dark', desc: '默认深色，图片像放在灯箱上：卡片间距极小，标题和摘要悬停时才出现，悬停光晕取自图片主色，详情用图片本身的模糊版作背景。强调色是钨丝灯琥珀。', fonts: 'Avenir Next / Condensed + 苹方', sw: ['#070708', '#1b1b1f', '#f4f3ef', '#8f8e96', '#f3b64a'] },
  editorial: { name: '编辑杂志风', code: '图录', theme: 'light', desc: '宣纸底色、宋体大标题、Didot 编号，像一本精选图录：首页有刊头，滚动后只留下细吸顶栏；分类用斜线分隔，复制按钮做成朱砂印章。', fonts: '宋体 + Didot + 苹方', sw: ['#f3eee3', '#1d1a15', '#776e61', '#d6ccba', '#a3281b'] },
  soft: { name: '柔和现代', code: '柔光', theme: 'light', desc: '常见的现代产品风格：大圆角、柔和阴影、蓝色主按钮，信息层次清楚。最稳妥，但个性也最弱。', fonts: 'Avenir Next + 苹方', sw: ['#f3f5f9', '#ffffff', '#161b26', '#667085', '#3563f0'] },
};

/* ---------- 瀑布流：按缩略图宽高算位置，每张放进当前最短的一列 ---------- */
function gridCfg(width) {
  const m = mob();
  const gx = { minimal: m ? 10 : 22, immersive: m ? 4 : 6, editorial: m ? 12 : 28, soft: m ? 10 : 18 }[S.style];
  const gy = { minimal: m ? 18 : 30, immersive: m ? 4 : 6, editorial: m ? 22 : 36, soft: m ? 10 : 18 }[S.style];
  const minW = { minimal: 230, immersive: 210, editorial: 260, soft: 230 }[S.style];
  const cols = m ? 2 : Math.max(2, Math.floor((width + gx) / (minW + gx)));
  const body = { minimal: 50, immersive: 0, editorial: m ? 108 : 120, soft: m ? 106 : 126 }[S.style];
  return { gx, gy, cols, body };
}
function computeMasonryLayout(items, cols, width, gx, gy, body) {
  const colW = (width - gx * (cols - 1)) / cols;
  const h = new Array(cols).fill(0);
  const pos = items.map((it) => {
    const ratio = it.w ? Math.min(2, Math.max(0.5, it.h / it.w)) : 1.25;
    const imgH = Math.round(colW * ratio);
    let c = 0;
    for (let i = 1; i < cols; i++) if (h[i] < h[c] - 0.5) c = i;
    const top = h[c];
    h[c] += imgH + body + gy;
    return { left: c * (colW + gx), top, width: colW, imgH, height: imgH + body };
  });
  return { pos, height: Math.max(0, ...h) - gy };
}
function mountGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const { list, more } = visibleList();
  grid.innerHTML = list.map(card).join('') + (more ? SKEL.map(skCard).join('') : '');
  layoutGrid();
}
function layoutGrid() {
  const grid = document.getElementById('grid');
  if (!grid || !grid.clientWidth) return;
  const width = grid.clientWidth;
  const cfg = gridCfg(width);
  const els = [...grid.children];
  const data = els.map((el) => { const id = +el.dataset.id; return id < 0 ? SKEL[-1 - id] : ALL.get(id); });
  const L = computeMasonryLayout(data, cfg.cols, width, cfg.gx, cfg.gy, cfg.body);
  els.forEach((el, i) => {
    const p = L.pos[i];
    Object.assign(el.style, { left: p.left + 'px', top: p.top + 'px', width: p.width + 'px', height: p.height + 'px' });
    el.firstElementChild.style.height = p.imgH + 'px';
  });
  grid.style.height = L.height + 'px';
}

const EN = (it) => `A high-detail image in the "${it.tags[1]?.name ?? 'realistic'}" style, ${it.ratio} aspect ratio. Carefully balanced composition, cinematic lighting, rich material textures, clean and legible typography wherever text appears, ultra-sharp 8K rendering, professional color grading.\n\n(示意：英文提示词)`;
const RAW = (it) => JSON.stringify({ subject: it.title, category: it.category, style: it.tags.filter((t) => t.kind !== 'ratio').map((t) => t.name), aspect_ratio: it.ratio, quality: '8K', lighting: 'cinematic', negative: ['水印', '模糊', '多余手指'], seed: 20260929, strict_text: true }, null, 2);
function jsonColor(text) {
  const TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  let out = '', last = 0;
  for (const m of text.matchAll(TOKEN)) {
    out += esc(text.slice(last, m.index));
    const [whole, str, colon, lit, num] = m;
    if (str && colon) out += `<span class="j-k">${esc(str)}</span>${colon}`;
    else if (str) out += `<span class="j-s">${esc(str)}</span>`;
    else out += `<span class="j-n">${esc(whole)}</span>`;
    last = m.index + whole.length;
  }
  return out + esc(text.slice(last));
}
function variants(it) {
  const p = it.prompt.trim();
  if (p.startsWith('{')) {
    let pretty = p;
    try { pretty = JSON.stringify(JSON.parse(p), null, 2); } catch (e) { /* 不是合法 JSON 就原样显示 */ }
    return [['raw', '原文', pretty]];
  }
  const m = p.match(/\[中文\]\s*([\s\S]*?)\s*\[English\]\s*([\s\S]*)/);
  if (m) return [['zh', '中文', m[1]], ['en', 'English', m[2]], ['raw', '原文', p]];
  return [['zh', '中文', p], ['en', 'English', EN(it)], ['raw', '原文', RAW(it)]];
}
const pickVariant = (it) => { const vs = variants(it); return vs.find((x) => x[0] === S.tab) ?? vs[0]; };

  const nav = [['案例', 'image'], ['分类', 'folder'], ['标签', 'tag'], ['导入与索引', 'db']];
  const mark = S.style === 'minimal' ? '<span class="lg-dot"></span>' : S.style === 'immersive' ? '<span class="lg-orb"></span>' : S.style === 'soft' ? `<span class="lg-sq" style="width:28px;height:28px;border-radius:8px">${icon('sparkle', 15)}</span>` : '';
  return `<aside class="a-side"><div class="a-logo">${mark}<b>AI 图集</b><small>后台</small></div><nav class="a-nav" aria-label="后台导航">${nav.map(([l, ic], i) => `<a href="#" class="${i === 0 ? 'on' : ''}" data-act="${i === 0 ? 'alist' : 'noop'}">${icon(ic, 17)}<span>${l}</span></a>`).join('')}</nav><div class="a-foot">${themeToggle()}<a href="#" data-act="front" class="a-front">查看前台 ${icon('arrow', 12)}</a><div class="a-user"><span class="av">A</span><span>admin</span><button class="iconbtn sm" title="退出" aria-label="退出">${icon('logout', 15)}</button></div></div></aside>`;
}
function adminList() {
  const rows = BASE.slice(0, 10).map((it, i) => {
    const st = ROW_STATUS[i];
    const origin = i === 6 ? '手工创建' : `上游 · 例 ${it.up}`;
    return `<tr data-act="aedit"><td><div class="tc"><img src="${it.img}" alt=""><div><b>${esc(it.title)}</b><small>#${it.id} · ${origin}${i % 4 === 1 ? ' · 已手动修改' : ''}</small></div></div></td><td>${esc(it.category)}</td><td><span class="st ${st}">${STATUS[st]}</span></td><td><div class="tchips">${it.tags.slice(0, 2).map((t) => `<span class="tchip">${esc(t.name)}</span>`).join('')}</div></td><td class="mono">2026-09-${String(29 - (i % 3)).padStart(2, '0')} ${String(9 + i).padStart(2, '0')}:${String((i * 17) % 60).padStart(2, '0')}</td><td><button class="iconbtn sm" aria-label="编辑">${icon('pen', 15)}</button></td></tr>`;
  }).join('');
  return `<div class="a-head"><div><h1>案例</h1><p>共 ${fmt(TOTAL)} 条 · ${fmt(WITH_IMG)} 条有图</p></div><button class="btn primary" data-act="aedit">${icon('plus', 16)}新建案例</button></div>
  <div class="a-filters"><label class="a-search">${icon('search', 16)}<input placeholder="搜索标题或提示词"></label><select class="sel"><option>全部状态</option><option>已发布</option><option>草稿</option><option>已隐藏</option></select><select class="sel"><option>全部分类</option>${D.categories.map((c) => `<option>${c.name}</option>`).join('')}</select><select class="sel"><option>全部来源</option><option>上游导入</option><option>手工创建</option></select><select class="sel"><option>图片：不限</option><option>有图</option><option>无图</option></select></div>
  <div class="a-card"><table class="tbl"><thead><tr><th>案例</th><th>分类</th><th>状态</th><th>标签</th><th>更新时间</th><th></th></tr></thead><tbody>${rows}</tbody></table><div class="pager"><span>第 1 / ${Math.ceil(TOTAL / 20)} 页 · 每页 20 条</span><div><button class="btn sm" disabled>${icon('left', 14)}上一页</button><button class="btn sm">下一页${icon('right', 14)}</button></div></div></div>`;
}
function adminEdit() {
  const it = DEMO;
  const imgs = it.images;
  return `<div class="a-head"><div><a href="#" data-act="alist" class="a-back">${icon('left', 15)}返回列表</a><h1>编辑案例 #${it.id}</h1><p>上游 · 例 ${it.up} · 创建于 2026-09-28 17:03 · 更新于 2026-09-29 10:12</p></div><div class="a-actions"><button class="btn danger">${icon('trash', 16)}删除案例</button><button class="btn primary">${icon('save', 16)}保存修改</button></div></div>
  <div class="a-edit">
    <section class="a-card form">
      <div class="f2"><div class="fld"><label for="f-title">标题</label><input id="f-title" class="inp" value="${esc(it.title)}"></div><div class="fld"><label for="f-cat">分类</label><select id="f-cat" class="sel inp">${D.categories.map((c) => `<option ${c.name === it.category ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div></div>
      <div class="f2"><div class="fld"><label for="f-st">状态</label><select id="f-st" class="sel inp"><option>已发布</option><option>草稿</option><option>已隐藏</option></select></div><div class="fld"><label>提示词格式</label><div class="seg" role="tablist"><button role="tab" aria-selected="true">纯文本</button><button role="tab" aria-selected="false">JSON</button></div></div></div>
      <div class="f2"><div class="fld"><label for="f-src">来源</label><input id="f-src" class="inp" value="${esc(it.source)}"></div><div class="fld"><label for="f-url">来源链接</label><input id="f-url" class="inp" value="xhslink.com/a/9fK2" aria-invalid="true"><p class="ferr" role="alert">请输入以 http:// 或 https:// 开头的链接</p></div></div>
      <div class="fld"><label for="f-zh">中文提示词 <span class="bd warn">已手动修改，重新导入时不会覆盖</span></label><textarea id="f-zh" class="inp" rows="7">${esc(it.prompt)}</textarea></div>
      <div class="fld"><label for="f-en">英文提示词</label><textarea id="f-en" class="inp" rows="3" placeholder="可选"></textarea></div>
    </section>
    <div class="a-col">
      <section class="a-card"><h3>图片 <small>${imgs.length} 张 · 第一张为封面</small></h3><div class="imgs">${imgs.map((im, i) => `<div class="im"><img src="${im.img}" alt="">${i === 0 ? '<span class="cov">封面</span>' : ''}<div class="acts">${i ? `<button title="设为封面" aria-label="设为封面">${icon('star', 13)}</button>` : ''}<button title="删除图片" aria-label="删除图片">${icon('trash', 13)}</button></div></div>`).join('')}<label class="drop">${icon('upload', 20)}<span>拖入或点击上传图片</span><small>JPG / PNG / WebP，单张 ≤ 10 MB</small></label></div></section>
      <section class="a-card"><h3>标签</h3><div class="tagpick">${it.tags.map((t) => `<span class="tp">${esc(t.name)} <i>${KIND[t.kind]}</i><button aria-label="移除">${icon('x', 12)}</button></span>`).join('')}<button class="tp-add">${icon('plus', 12)} 添加标签</button></div></section>
      <section class="a-card"><h3>导入信息</h3><dl class="meta-list"><dt>上游位置</dt><dd>${esc(it.category)} · 例 ${it.up}</dd><dt>上游版本</dt><dd class="mono">3f9a1c2</dd><dt>手动修改</dt><dd>中文提示词</dd></dl></section>
    </div>
  </div>`;
}

/* ---------- 渲染 ---------- */
function applyTheme() {
  S.theme = S.themePref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.themePref;
  device.dataset.theme = S.theme;
  device.querySelectorAll('.ttg [role=radio]').forEach((b) => b.setAttribute('aria-checked', b.dataset.v === S.themePref));
  const cyc = device.querySelector('[data-act=cycle]');
  if (cyc) cyc.innerHTML = icon(S.theme === 'dark' ? 'moon' : 'sun', 18);
  syncControls();
}
function syncControls() {
  const vals = { style: S.style, page: S.page, theme: S.theme, vp: S.vp };
  document.querySelectorAll('.ctl-seg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === vals[g.dataset.k])));
  const st = STYLES[S.style];
  $('#desc').innerHTML = `<b>${st.name}「${st.code}」</b><span>${st.desc}</span><span>字体：${st.fonts}</span><span class="ctl-sw">${st.sw.map((c) => `<i style="background:${c}" title="${c}"></i>`).join('')}</span><span class="ctl-tip">卡片可点开 · ← → 切换 · Esc 关闭 · / 搜索 · 1–4 换风格</span>`;
  document.documentElement.style.setProperty('--ctl-h', $('#ctl').offsetHeight + 'px');
}
function render() {
  device.dataset.style = S.style;
  device.dataset.vp = S.vp;
  stage.dataset.vp = S.vp;
  applyTheme();
  if (isAdmin()) {
    app.innerHTML = `<div class="admin">${adminSide()}<main class="a-main">${S.page === 'admin-edit' ? adminEdit() : adminList()}</main></div>`;
  } else {
    app.innerHTML = `${S.style === 'editorial' ? masthead() : ''}${header()}<main class="main"><div class="wrap" id="results">${resultsHTML()}</div></main>`;
    mountGrid();
  }
  renderLayer();
}
function rerenderHeader() {
  const old = app.querySelector('.hdr');
  if (old) old.outerHTML = header();
  renderLayer();
}
function updateResults() {
  const r = document.getElementById('results');
  if (!r) return;
  r.innerHTML = resultsHTML();
  mountGrid();
}
function renderLayer() {
  let h = '';
  if (!isAdmin()) {
    if (mob() && S.filterOpen) h += `<div class="backdrop" data-act="filter"></div><div class="sheet" role="dialog" aria-label="筛选"><div class="grab"></div><h3>筛选</h3>${filterBody()}</div>`;
    if (S.detail) h += detailModal();
  }
  layer.innerHTML = h;
  scroller.style.overflowY = S.detail || (mob() && S.filterOpen) ? 'hidden' : '';
}
function preset(p) {
  Object.assign(S, { page: p, detail: null, filterOpen: false, q: '', cat: null, tag: null, hasImage: true, imgIdx: 0, tab: 'zh' });
  if (p === 'search') {
    S.q = '设计';
    const pool = ITEMS.filter((i) => (i.title + i.excerpt + i.category + i.prompt).includes(S.q));
    const counts = {};
    pool.forEach((i) => i.tags.forEach((t) => (counts[t.name] = (counts[t.name] || 0) + 1)));
    S.tag = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
    S.filterOpen = true;
  }
  if (p === 'detail') { S.detail = DEMO.id; S.basePage = 'gallery'; }
  if (!p.startsWith('admin') && p !== 'detail') S.basePage = p;
}
function openDetail(id) {
  if (!ALL.has(id)) return;
  if (S.page !== 'detail') S.basePage = S.page;
  Object.assign(S, { detail: id, imgIdx: 0, tab: 'zh', page: 'detail', filterOpen: mob() ? false : S.filterOpen });
  syncControls();
  renderLayer();
}
function closeDetail() {
  S.detail = null;
  S.page = S.basePage || 'gallery';
  syncControls();
  renderLayer();
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1600);
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); } catch (e) { /* 设计稿里失败也照常提示 */ }
  toast(`已复制${label}提示词`);
}

/* ---------- 事件 ---------- */
device.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !device.contains(el)) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'hasimg') return;
  e.preventDefault();
  switch (act) {
    case 'open': openDetail(+el.dataset.id); break;
    case 'close': closeDetail(); break;
    case 'go': if (v) { S.detail = +v; S.imgIdx = 0; renderLayer(); } break;
    case 'img': S.imgIdx = +v; renderLayer(); break;
    case 'tab': S.tab = v; renderLayer(); break;
    case 'copy': { const it = ALL.get(S.detail); const x = pickVariant(it); copy(x[2], variants(it).length > 1 ? (x[1] === 'English' ? '英文' : x[1]) : ''); break; }
    case 'qcopy': copy(ALL.get(+el.dataset.id).prompt, ''); break;
    case 'random': { const { list } = visibleList(); const pool = list.filter((i) => i.img); if (pool.length) openDetail(pool[Math.floor(Math.random() * pool.length)].id); else toast('当前筛选下没有带图片的案例'); break; }
    case 'cat': S.cat = v || null; render(); scroller.scrollTop = 0; break;
    case 'tag': S.tag = S.tag === v ? null : v; render(); break;
    case 'filter': S.filterOpen = !S.filterOpen; rerenderHeader(); break;
    case 'resetf': S.tag = null; S.hasImage = true; render(); break;
    case 'clearall': S.q = ''; S.cat = null; S.tag = null; S.page = 'gallery'; render(); break;
    case 'clearq': S.q = ''; $('#q').value = ''; el.classList.add('hide'); updateResults(); $('#q').focus(); break;
    case 'rm': if (v === 'cat') S.cat = null; if (v === 'tag') S.tag = null; if (v === 'hasimg') S.hasImage = true; render(); break;
    case 'theme': S.themePref = v; applyTheme(); break;
    case 'cycle': S.themePref = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); break;
    case 'home': preset('gallery'); render(); scroller.scrollTop = 0; break;
    case 'aedit': S.page = 'admin-edit'; render(); scroller.scrollTop = 0; break;
    case 'alist': S.page = 'admin'; render(); scroller.scrollTop = 0; break;
    case 'front': preset('gallery'); render(); scroller.scrollTop = 0; break;
  }
});
device.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'hasimg') { S.hasImage = e.target.checked; render(); }
});
let qTimer;
device.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value.trim();
  device.querySelector('.clr')?.classList.toggle('hide', !e.target.value);
  clearTimeout(qTimer);
  qTimer = setTimeout(updateResults, 250);
});
$('#ctl').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  const k = b.closest('.ctl-seg').dataset.k, v = b.dataset.v;
  if (k === 'style') { S.style = v; S.themePref = STYLES[v].theme; render(); }
  if (k === 'page') { preset(v); render(); scroller.scrollTop = 0; }
  if (k === 'theme') { S.themePref = v; applyTheme(); }
  if (k === 'vp') { S.vp = v; if (v === 'mobile') S.filterOpen = false; render(); }
});
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (S.detail) {
    if (e.key === 'Escape') { closeDetail(); return; }
    if (e.key === 'ArrowLeft') device.querySelector('[data-act=go][aria-label=上一条]:not(:disabled)')?.click();
    if (e.key === 'ArrowRight') device.querySelector('[data-act=go][aria-label=下一条]:not(:disabled)')?.click();
    return;
  }
  if (e.key === 'Escape' && S.filterOpen) { S.filterOpen = false; rerenderHeader(); return; }
  if (typing) return;
  if (e.key === '/' && !isAdmin()) { e.preventDefault(); $('#q')?.focus(); }
  const n = ['1', '2', '3', '4'].indexOf(e.key);
  if (n >= 0) { S.style = Object.keys(STYLES)[n]; S.themePref = STYLES[S.style].theme; render(); }
});
new ResizeObserver(() => {
  device.style.setProperty('--dev-h', device.clientHeight + 'px');
  layoutGrid();
}).observe(device);
window.addEventListener('resize', syncControls);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.themePref === 'system' && applyTheme());

render();
</script>
</body>
</html>
