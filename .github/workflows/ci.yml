name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: ai_images_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: ci-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      ATLAS_TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/ai_images_test
      ATLAS_TEST_MEILI_URL: http://localhost:7700
      ATLAS_TEST_MEILI_KEY: ci-master-key-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv python install 3.12 && uv sync --project backend
      - name: 文档检查
        run: uv run --project backend python scripts/docs.py check
      - name: 前端接口类型与后端一致
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api
          git diff --exit-code -- src/api/generated
